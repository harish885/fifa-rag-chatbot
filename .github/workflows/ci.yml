name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Syntax / compile check
        run: python -m compileall -q rag api eval scripts local_server.py

      - name: Run tests
        run: python -m pytest

      - name: Evaluation regression check
        run: python eval/check_regression.py

      - name: Execute notebook (no Groq key -> generation cell skips)
        env:
          GROQ_API_KEY: ""
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=300 \
            --output /tmp/walkthrough.executed.ipynb walkthrough.ipynb

      - name: Working tree must stay clean after eval + notebook
        run: |
          git diff --stat
          git diff --exit-code -- eval/results.json

      - name: Dependency audit (deployment deps)
        run: python -m pip_audit -r requirements.txt
